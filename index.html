<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Flashcards</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- ========================= -->
    <!-- VERSION -->
    <!-- ========================= -->

    <div class="version">
        v0.9.0
    </div>


    <main class="container">


        <!-- ========================= -->
        <!-- FLASHCARD -->
        <!-- ========================= -->

        <div class="card">

            <div id="word"
                 class="word">
                Loading...
            </div>


            <div id="sentence"
                 class="sentence hidden">
            </div>


            <div id="answer"
                 class="answer hidden">
            </div>


            <div id="sentenceTranslation"
                 class="sentence-translation hidden">
            </div>


            <button id="sentenceButton">
                Show Sentence
            </button>


            <button id="answerButton">
                Show Answer
            </button>


            <div id="reviewButtons"
                 class="review-buttons hidden">

                <button id="mistakeButton"
                        class="mistake-button">
                    ❌ Mistake
                </button>

                <button id="hardButton"
                        class="hard-button">
                    😕 Hard
                </button>

                <button id="goodButton"
                        class="good-button">
                    🙂 Good
                </button>

                <button id="easyButton"
                        class="easy-button">
                    😄 Easy
                </button>

                <button id="skipButton"
                        class="skip-button hidden">
                    ⏭️ Skip
                </button>

            </div>


            <!-- Normally hidden -->
            <div id="progressInfo"
                 class="progress-info hidden">
            </div>

        </div>


        <!-- ========================= -->
        <!-- OPTION BAR -->
        <!-- ========================= -->

        <div class="option-bar">

            <button id="dataMenuButton"
                    class="option-button"
                    title="Data">
                💾
            </button>


            <button id="cardsMenuButton"
                    class="option-button"
                    title="Cards">
                ✍️
            </button>


            <button id="tagsMenuButton"
                    class="option-button"
                    title="Tags">
                🏷️
            </button>


            <button id="reviewMenuButton"
                    class="option-button"
                    title="Review">
                📚
            </button>


            <button id="infoMenuButton"
                    class="option-button"
                    title="Information">
                ℹ️
            </button>


            <button id="darkModeButton"
                    class="option-button"
                    title="Toggle dark mode">
                🌙
            </button>

        </div>


        <!-- ========================= -->
        <!-- DATA PANEL -->
        <!-- ========================= -->

        <div id="dataPanel"
             class="option-panel hidden">

            <div class="panel-title">
                💾 Data
            </div>


            <div class="panel-description">
                Back up your cards and study progress.
            </div>


            <button id="exportCardsButton">
                Export Cards
            </button>

            <button id="importCardsButton">
                Import Cards
            </button>

            <input
                type="file"
                id="cardsFileInput"
                accept=".json"
                class="hidden"
            >


            <hr>


            <button id="exportProgressButton">
                Export Progress
            </button>

            <button id="importProgressButton">
                Import Progress
            </button>

            <input
                type="file"
                id="progressFileInput"
                accept=".json"
                class="hidden"
            >

        </div>


        <!-- ========================= -->
        <!-- CARD MANAGEMENT -->
        <!-- ========================= -->

        <div id="cardsPanel"
             class="option-panel hidden">

            <div class="panel-title">
                ✍️ Cards
            </div>


            <button id="addCardButton">
                ＋ Add Card
            </button>


            <div id="editorForm"
                 class="hidden">


                <label>
                    Word
                </label>

                <input
                    id="wordInput"
                    type="text"
                    placeholder="coffee shop"
                >


                <label>
                    Translation
                </label>

                <input
                    id="translationInput"
                    type="text"
                    placeholder="cafetería"
                >


                <label>
                    Sentence
                </label>

                <textarea
                    id="sentenceInput"
                    placeholder="I went to the coffee shop."
                ></textarea>


                <label>
                    Translated sentence
                </label>

                <textarea
                    id="sentenceTranslationInput"
                    placeholder="Fui a la cafetería."
                ></textarea>


                <label>
                    Tags
                </label>

                <input
                    id="tagsInput"
                    type="text"
                    placeholder="places, food, common"
                >


                <div class="editor-buttons">

                    <button id="saveCardButton">
                        Save Card
                    </button>

                    <button id="cancelEditButton">
                        Cancel
                    </button>

                </div>


                <div id="editorMessage">
                </div>

            </div>


            <div id="cardManager">
            </div>

        </div>


        <!-- ========================= -->
        <!-- TAG FILTERS -->
        <!-- ========================= -->

        <div id="tagsPanel"
             class="option-panel hidden">

            <div class="panel-title">
                🏷️ Categories
            </div>


            <div id="tagButtons"
                 class="tag-buttons">
            </div>


            <div class="filter-mode">

                <button id="orButton"
                        class="mode-button active">
                    OR
                </button>

                <button id="andButton"
                        class="mode-button">
                    AND
                </button>

            </div>

        </div>


        <!-- ========================= -->
        <!-- REVIEW -->
        <!-- ========================= -->

        <div id="reviewPanel"
             class="option-panel hidden">

            <div class="panel-title">
                📚 Review
            </div>


            <div class="panel-description">
                Review cards regardless of their scheduled due time.
            </div>


            <button id="reviewAllButton">
                📚 Review All
            </button>


            <label class="new-card-option">

                <input
                    type="checkbox"
                    id="includeNewCardsCheckbox"
                >

                Include new cards

            </label>


            <div id="reviewStatus"
                 class="review-status">
            </div>

        </div>


        <!-- ========================= -->
        <!-- INFORMATION -->
        <!-- ========================= -->

        <div id="infoPanel"
             class="option-panel hidden">

            <div class="panel-title">
                ℹ️ Information
            </div>


            <div id="studyInfo"
                 class="study-info">
            </div>


            <hr>


            <div class="debug-title">
                Developer Information
            </div>


            <div id="debugInfo"
                 class="debug-info">
                Loading...
            </div>

        </div>


    </main>


    <script src="script.js"></script>

</body>

</html>
