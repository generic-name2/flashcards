<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="due-counter"
         id="dueCounter">
        Due 0
    </div>


    <div class="version">
        v0.9.0 no flashcards title
    </div>


    <main class="container">




        <!-- ========================= -->
        <!-- FLASHCARD -->
        <!-- ========================= -->

        <div class="card">

            <div id="word"
                 class="word">
                Loading...
            </div>


            <div id="sentence"
                 class="sentence hidden">
            </div>


            <div id="answer"
                 class="answer hidden">
            </div>


            <div id="sentenceTranslation"
                 class="sentence-translation hidden">
            </div>


            <button id="sentenceButton">
                Show Sentence
            </button>


            <button id="answerButton">
                Show Answer
            </button>


            <div id="reviewButtons"
                 class="review-buttons hidden">

                <button id="mistakeButton">
                    ❌ Mistake
                </button>

                <button id="hardButton">
                    😕 Hard
                </button>

                <button id="goodButton">
                    🙂 Good
                </button>

                <button id="easyButton">
                    😄 Easy
                </button>

                <button id="skipButton"
                        class="hidden">
                    ⏭️ Skip
                </button>

            </div>


            <div id="progressInfo"
                 class="progress-info">
            </div>

        </div>


        <!-- ========================= -->
        <!-- OPTION BAR -->
        <!-- ========================= -->

        <div class="option-bar">

            <button id="dataMenuButton"
                    class="option-button"
                    title="Import / Export">
                💾
            </button>

            <button id="cardsMenuButton"
                    class="option-button"
                    title="Manage Cards">
                📝
            </button>

            <button id="tagsMenuButton"
                    class="option-button"
                    title="Tags">
                🏷️
            </button>

            <button id="reviewMenuButton"
                    class="option-button"
                    title="Review All">
                📚
            </button>

            <button id="infoMenuButton"
                    class="option-button"
                    title="Information">
                ℹ️
            </button>

            <button id="darkModeButton"
                    class="option-button"
                    title="Switch to light mode">
                🌙
            </button>

        </div>


        <!-- ========================= -->
        <!-- DATA PANEL -->
        <!-- ========================= -->

        <div id="dataPanel"
             class="option-panel hidden">

            <div class="panel-title">
                My Data
            </div>


            <button id="exportCardsButton">
                Export Cards
            </button>

            <button id="importCardsButton">
                Import Cards
            </button>

            <input
                type="file"
                id="cardsFileInput"
                accept=".json"
                class="hidden"
            >


            <br>


            <button id="exportProgressButton">
                Export Progress
            </button>

            <button id="importProgressButton">
                Import Progress
            </button>

            <input
                type="file"
                id="progressFileInput"
                accept=".json"
                class="hidden"
            >

        </div>


        <!-- ========================= -->
        <!-- CARD MANAGEMENT PANEL -->
        <!-- ========================= -->

        <div id="cardsPanel"
             class="option-panel hidden">

            <div class="panel-title">
                Card Editor
            </div>


            <button id="addCardButton">
                ＋ Add Card
            </button>


            <div id="editorForm"
                 class="hidden">


                <label>
                    Word
                </label>

                <input
                    id="wordInput"
                    type="text"
                    placeholder="coffee shop"
                >


                <label>
                    Translation
                </label>

                <input
                    id="translationInput"
                    type="text"
                    placeholder="cafetería"
                >


                <label>
                    Sentence
                </label>

                <textarea
                    id="sentenceInput"
                    placeholder="I went to the coffee shop."
                ></textarea>


                <label>
                    Translated sentence
                </label>

                <textarea
                    id="sentenceTranslationInput"
                    placeholder="Fui a la cafetería."
                ></textarea>


                <label>
                    Tags
                </label>

                <input
                    id="tagsInput"
                    type="text"
                    placeholder="places, food, common"
                >


                <div class="editor-buttons">

                    <button id="saveCardButton">
                        Save Card
                    </button>

                    <button id="cancelEditButton">
                        Cancel
                    </button>

                </div>


                <div id="editorMessage">
                </div>

            </div>


            <div id="cardManager">
            </div>

        </div>


        <!-- ========================= -->
        <!-- TAG PANEL -->
        <!-- ========================= -->

        <div id="tagsPanel"
             class="option-panel hidden">

            <div class="panel-title">
                Categories
            </div>


            <div id="tagButtons"
                 class="tag-buttons">
            </div>


            <div class="filter-mode">

                <button id="orButton"
                        class="mode-button active">
                    OR
                </button>

                <button id="andButton"
                        class="mode-button">
                    AND
                </button>

            </div>

        </div>


        <!-- ========================= -->
        <!-- REVIEW PANEL -->
        <!-- ========================= -->

        <div id="reviewPanel"
             class="option-panel hidden">

            <div class="panel-title">
                Review
            </div>


            <button id="studyModeButton">
                🧠 Study Due
            </button>


            <button id="reviewAllButton">
                📚 Review All
            </button>


            <label class="include-new">

                <input
                    type="checkbox"
                    id="includeNewCheckbox"
                >

                Include New cards in Review All

            </label>

        </div>


        <!-- ========================= -->
        <!-- INFORMATION PANEL -->
        <!-- ========================= -->

        <div id="infoPanel"
             class="option-panel hidden">

            <div class="panel-title">
                Study Information
            </div>


            <div id="studyInfo"
                 class="study-info">
            </div>


            <div class="debug-panel">

                <div class="debug-title">
                    Developer Information
                </div>

                <div id="debugInfo">
                    Loading...
                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
