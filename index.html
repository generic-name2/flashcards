<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Flashcards</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="version">
        v0.5.0
    </div>


    <main class="container">

        <h1>My Flashcards</h1>


        <!-- ========================= -->
        <!-- DATA MANAGEMENT -->
        <!-- ========================= -->

        <div class="data-panel">

            <div class="filter-title">
                My Data
            </div>


            <button id="exportCardsButton">
                Export Cards
            </button>

            <button id="importCardsButton">
                Import Cards
            </button>

            <input
                type="file"
                id="cardsFileInput"
                accept=".json"
                class="hidden"
            >


            <br>


            <button id="exportProgressButton">
                Export Progress
            </button>

            <button id="importProgressButton">
                Import Progress
            </button>

            <input
                type="file"
                id="progressFileInput"
                accept=".json"
                class="hidden"
            >

        </div>


        <!-- ========================= -->
        <!-- TAG FILTERS -->
        <!-- ========================= -->

        <div class="filters">

            <div class="filter-title">
                Categories
            </div>


            <div id="tagButtons"
                 class="tag-buttons">
            </div>


            <div class="filter-mode">

                <button id="orButton"
                        class="mode-button active">
                    OR
                </button>

                <button id="andButton"
                        class="mode-button">
                    AND
                </button>

            </div>

        </div>


        <!-- ========================= -->
        <!-- CARD -->
        <!-- ========================= -->

        <div class="card">

            <div id="word"
                 class="word">
                Loading...
            </div>


            <div id="sentence"
                 class="sentence hidden">
            </div>


            <div id="answer"
                 class="answer hidden">
            </div>


            <div id="sentenceTranslation"
                 class="sentence-translation hidden">
            </div>


            <button id="sentenceButton">
                Show Sentence
            </button>


            <button id="answerButton">
                Show Answer
            </button>


            <div id="reviewButtons"
                 class="review-buttons hidden">

                <button id="mistakeButton">
                    ❌ Mistake
                </button>

                <button id="hardButton">
                    😕 Hard
                </button>

                <button id="goodButton">
                    🙂 Good
                </button>

                <button id="easyButton">
                    😄 Easy
                </button>

            </div>


            <div id="progressInfo"
                 class="progress-info">
            </div>

        </div>


        <!-- ========================= -->
        <!-- STUDY INFO -->
        <!-- ========================= -->

        <div id="studyInfo"
             class="study-info">
        </div>


        <!-- ========================= -->
        <!-- DEBUG -->
        <!-- ========================= -->

        <div class="debug-panel">

            <div class="debug-title">
                Developer Information
            </div>

            <div id="debugInfo">
                Loading...
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
