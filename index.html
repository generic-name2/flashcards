<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Flashcards</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <div class="version">
        v0.4.0
    </div>


    <main class="container">

        <h1>My Flashcards</h1>


        <!-- TAG FILTERS -->

        <div class="filters">

            <div class="filter-title">
                Categories
            </div>

            <div id="tagButtons"
                 class="tag-buttons">
            </div>


            <div class="filter-mode">

                <button id="orButton"
                        class="mode-button active">
                    OR
                </button>

                <button id="andButton"
                        class="mode-button">
                    AND
                </button>

            </div>

        </div>


        <!-- CARD -->

        <div class="card">

            <!-- Question word -->

            <div id="word"
                 class="word">
                Loading...
            </div>


            <!-- Question sentence -->

            <div id="sentence"
                 class="sentence hidden">
            </div>


            <!-- Answer word -->

            <div id="answer"
                 class="answer hidden">
            </div>


            <!-- Answer sentence -->

            <div id="sentenceTranslation"
                 class="sentence-translation hidden">
            </div>


            <!-- Sentence button -->

            <button id="sentenceButton">
                Show Sentence
            </button>


            <!-- Answer button -->

            <button id="answerButton">
                Show Answer
            </button>


            <!-- Review buttons -->

            <div id="reviewButtons"
                 class="review-buttons hidden">

                <button id="mistakeButton">
                    ❌ Mistake
                </button>

                <button id="hardButton">
                    😕 Hard
                </button>

                <button id="goodButton">
                    🙂 Good
                </button>

                <button id="easyButton">
                    😄 Easy
                </button>

            </div>


            <!-- Progress -->

            <div id="progressInfo"
                 class="progress-info">
            </div>

        </div>


        <!-- STUDY INFORMATION -->

        <div id="studyInfo"
             class="study-info">
        </div>


        <!-- DEBUG -->

        <div class="debug-panel">

            <div class="debug-title">
                Developer Information
            </div>

            <div id="debugInfo">
                Loading...
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
